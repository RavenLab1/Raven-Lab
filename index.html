    :root {
      --brand-green: #aed349;
      --brand-green-hover: #9cc03d;
      --bg-white: #ffffff;
      --bg-light: #f8fafc;
      --text-dark: #111827;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --discount-red: #ef4444;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, .05);
      --shadow-md: 0 12px 28px rgba(15, 23, 42, .08);
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, .16);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 28px;
      --nav-height: 76px;
      --nav-bg: rgba(255,255,255,.92);
      --footer-bg: #111827;
      --footer-text: #ffffff;
      --footer-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-height) + 24px); }
    body {
      font-family: 'Noto Sans Arabic', 'Baloo Bhaijaan 2', 'Alexandria', sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      overflow-x: hidden;
      line-height: 1.65;
    }
    body.modal-open { overflow: hidden; }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    img { display: block; }
    :focus-visible { outline: 3px solid var(--brand-green); outline-offset: 3px; }
    .container { width: min(92%, 1200px); margin-inline: auto; }

    body.dark-theme {
      --bg-white: #0f1117;
      --bg-light: #171b23;
      --text-dark: #f8fafc;
      --text-muted: #a7b0bf;
      --border-color: #2b3240;
      --nav-bg: rgba(15,17,23,.9);
      --footer-bg: #090b10;
      --footer-text: #f8fafc;
      --footer-muted: #9ca3af;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .26);
      --shadow-md: 0 12px 28px rgba(0, 0, 0, .34);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
    }
    body.dark-theme .art-card::before { opacity: .82; }
    body.dark-theme .brand-mark,
    body.dark-theme .btn-primary,
    body.dark-theme .btn-whatsapp,
    body.dark-theme .nav-cta,
    body.dark-theme .badge { box-shadow: 0 10px 24px rgba(156, 192, 61, .18); }
    html[dir="ltr"] .search-box i { right: auto; left: 16px; }
    html[dir="ltr"] .search-box input { padding: 0 16px 0 46px; }
    html[dir="ltr"] .close { left: auto; right: 14px; }
    html[dir="ltr"] .badge { right: auto; left: 14px; }
    html[dir="ltr"] .discount-badge { margin-right: 0; margin-left: auto; }
    html[dir="ltr"] .product-card:hover .card-action i { transform: translateX(3px); }
