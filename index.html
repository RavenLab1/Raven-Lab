  <style>
    :root {
      --brand-green: #aed349;
      --brand-green-hover: #9cc03d;
      --bg-white: #ffffff;
      --bg-light: #f8fafc;
      --text-dark: #111827;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --discount-red: #ef4444;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, .05);
      --shadow-md: 0 12px 28px rgba(15, 23, 42, .08);
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, .16);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 28px;
      --nav-height: 76px;
      --nav-bg: rgba(255,255,255,.92);
      --footer-bg: #111827;
      --footer-text: #ffffff;
      --footer-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-height) + 24px); }
    body {
      font-family: 'Noto Sans Arabic', 'Baloo Bhaijaan 2', 'Alexandria', sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      overflow-x: hidden;
      line-height: 1.65;
    }
    body.modal-open { overflow: hidden; }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    img { display: block; }
    :focus-visible { outline: 3px solid var(--brand-green); outline-offset: 3px; }
    .container { width: min(92%, 1200px); margin-inline: auto; }

    body.dark-theme {
      --bg-white: #0f1117;
      --bg-light: #171b23;
      --text-dark: #f8fafc;
      --text-muted: #a7b0bf;
      --border-color: #2b3240;
      --nav-bg: rgba(15,17,23,.9);
      --footer-bg: #090b10;
      --footer-text: #f8fafc;
      --footer-muted: #9ca3af;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .26);
      --shadow-md: 0 12px 28px rgba(0, 0, 0, .34);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
    }
    body.dark-theme .art-card::before { opacity: .82; }
    body.dark-theme .brand-mark,
    body.dark-theme .btn-primary,
    body.dark-theme .btn-whatsapp,
    body.dark-theme .nav-cta,
    body.dark-theme .badge { box-shadow: 0 10px 24px rgba(156, 192, 61, .18); }
    html[dir="ltr"] .search-box i { right: auto; left: 16px; }
    html[dir="ltr"] .search-box input { padding: 0 16px 0 46px; }
    html[dir="ltr"] .close { left: auto; right: 14px; }
    html[dir="ltr"] .badge { right: auto; left: 14px; }
    html[dir="ltr"] .discount-badge { margin-right: 0; margin-left: auto; }
    html[dir="ltr"] .product-card:hover .card-action i { transform: translateX(3px); }

    /* Navigation */
    nav {
      position: fixed;
      inset: 0 0 auto;
      z-index: 1000;
      height: var(--nav-height);
      background: var(--nav-bg);
      border-bottom: 1px solid rgba(226,232,240,.9);
      backdrop-filter: blur(16px);
      transition: box-shadow .25s ease;
    }
    nav.scrolled { box-shadow: var(--shadow-md); }
    .nav-content { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 22px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text-dark); text-decoration: none; font-weight: 800; font-size: 1.35rem; white-space: nowrap; }
    .brand-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-green); box-shadow: 0 7px 18px rgba(174,211,73,.32); }
    .brand span span { color: var(--brand-green-hover); }
    .nav-links { display: flex; align-items: center; gap: 6px; list-style: none; }
    .nav-links a { color: var(--text-dark); text-decoration: none; font-weight: 700; font-size: 1.02rem; padding: 8px 14px; border-radius: 10px; transition: .2s ease; }
    .nav-links a:hover { background: var(--bg-light); color: var(--brand-green-hover); }
    .nav-cta { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 11px; background: var(--brand-green); color: var(--text-dark); text-decoration: none; font-weight: 800; white-space: nowrap; transition: .2s ease; }
    .nav-cta:hover { background: var(--brand-green-hover); transform: translateY(-1px); }
    .nav-controls { display: inline-flex; align-items: center; gap: 8px; }
    .theme-toggle, .lang-btn {
      min-height: 40px;
      border: 1px solid var(--border-color);
      background: var(--bg-white);
      color: var(--text-dark);
      border-radius: 11px;
      cursor: pointer;
      font-weight: 800;
      transition: .2s ease;
    }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; white-space: nowrap; }
    .theme-toggle:hover, .lang-btn:hover { border-color: var(--brand-green); background: var(--bg-light); }
    .theme-toggle i { color: var(--brand-green-hover); }
    .language-switcher { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--border-color); border-radius: 13px; background: var(--bg-light); }
    .lang-btn { min-width: 48px; padding: 6px 10px; font-size: .9rem; background: transparent; border-color: transparent; }
    .lang-btn.active { background: var(--brand-green); color: #111827; border-color: var(--brand-green); }
    .menu-toggle { display: none; width: 42px; height: 42px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-white); color: var(--text-dark); cursor: pointer; }

    /* Hero */
    header { min-height: 650px; padding: calc(var(--nav-height) + 72px) 0 78px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); position: relative; overflow: hidden; }
    header::before, header::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
    header::before { width: 440px; height: 440px; background: rgba(174,211,73,.15); top: -190px; left: -130px; }
    header::after { width: 280px; height: 280px; border: 55px solid rgba(174,211,73,.09); bottom: -145px; right: -80px; }
    .hero-layout { position: relative; z-index: 1; display: grid; grid-template-columns: 1.08fr .92fr; align-items: center; gap: 70px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; background: var(--bg-light); border: 1px solid var(--border-color); border-radius: 999px; padding: 7px 13px; color: var(--text-muted); font-weight: 700; margin-bottom: 18px; }
    .eyebrow i { color: var(--brand-green-hover); }
    header h1 { font-size: clamp(3.2rem, 7vw, 5.5rem); line-height: .98; font-weight: 800; letter-spacing: -2px; margin-bottom: 24px; }
    header h1 span { color: var(--brand-green); }
    header p { font-size: 1.22rem; color: var(--text-muted); max-width: 620px; margin-bottom: 30px; }
    .hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .btn-primary, .btn-secondary { min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 24px; border-radius: 13px; text-decoration: none; font-weight: 800; font-size: 1.08rem; transition: .25s ease; }
    .btn-primary { background: var(--brand-green); color: var(--text-dark); box-shadow: 0 10px 22px rgba(174,211,73,.3); }
    .btn-primary:hover { background: var(--brand-green-hover); transform: translateY(-2px); box-shadow: 0 14px 28px rgba(174,211,73,.36); }
    .btn-secondary { background: var(--bg-white); color: var(--text-dark); border: 1px solid var(--border-color); }
    .btn-secondary:hover { border-color: var(--brand-green); background: var(--bg-light); }
    .hero-trust { display: flex; flex-wrap: wrap; gap: 16px 24px; margin-top: 28px; color: var(--text-muted); font-weight: 700; }
    .hero-trust span { display: inline-flex; align-items: center; gap: 7px; }
    .hero-trust i { color: var(--brand-green-hover); }
    .hero-art { position: relative; min-height: 390px; display: grid; place-items: center; }
    .art-card { width: min(100%, 430px); aspect-ratio: 1/1; background: var(--bg-light); border: 1px solid var(--border-color); border-radius: 38px; box-shadow: var(--shadow-lg); position: relative; display: grid; place-items: center; transform: rotate(-3deg); }
    .art-card::before { content: ''; width: 65%; height: 65%; position: absolute; border-radius: 50%; background: var(--brand-green); opacity: .95; }
    .cube { width: 145px; height: 145px; position: relative; z-index: 2; transform: rotate(12deg); filter: drop-shadow(0 24px 20px rgba(17,24,39,.2)); }
    .cube i { font-size: 9rem; color: var(--text-dark); }
    .floating-pill { position: absolute; z-index: 3; background: var(--bg-white); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); border-radius: 16px; padding: 11px 15px; font-weight: 800; display: flex; align-items: center; gap: 9px; animation: float 4s ease-in-out infinite; }
    .floating-pill i { color: var(--brand-green-hover); }
    .pill-one { top: 15%; right: -2%; }
    .pill-two { bottom: 12%; left: -3%; animation-delay: -2s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
